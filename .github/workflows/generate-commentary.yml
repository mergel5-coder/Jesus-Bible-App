name: Generate chapter commentary

# Trigger this manually from the GitHub website:
# Actions tab -> "Generate chapter commentary" -> "Run workflow"
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        default: "fetch-bsb-test"
        type: choice
        options:
          - list-tables
          - view-commentary-john
          - view-commentary-genesis
          - view-commentary-revelation
          - get-workspace-id
          - mark-rewrite-john
          - fetch-bsb-test
          - fetch-bsb-full
          - generate-batch-submit-john
          - generate-batch-submit-genesis
          - generate-batch-submit-revelation
          - generate-batch-submit-all
          - generate-batch-check
          - export-bundle

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: List tables in the connected Turso database (diagnostic)
        if: ${{ github.event.inputs.step == 'list-tables' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node list-tables.js

      - name: View generated John commentary (diagnostic)
        if: ${{ github.event.inputs.step == 'view-commentary-john' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node view-commentary.js --book "John"

      - name: View generated Genesis commentary (diagnostic)
        if: ${{ github.event.inputs.step == 'view-commentary-genesis' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node view-commentary.js --book "Genesis"

      - name: View generated Revelation commentary (diagnostic)
        if: ${{ github.event.inputs.step == 'view-commentary-revelation' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node view-commentary.js --book "Revelation"

      - name: Get workspace ID from a live API response (diagnostic)
        if: ${{ github.event.inputs.step == 'get-workspace-id' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node get-workspace-id.js

      - name: Mark John chapters for rewrite (after a prompt change)
        if: ${{ github.event.inputs.step == 'mark-rewrite-john' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node mark-rewrite.js --book "John"

      - name: Restore cached Bible text (if it exists from a previous run)
        uses: actions/cache@v4
        with:
          path: data
          key: bsb-data-${{ github.run_id }}
          restore-keys: |
            bsb-data-

      - name: Run fetch-bsb.js (test)
        if: ${{ github.event.inputs.step == 'fetch-bsb-test' }}
        run: node fetch-bsb.js --test

      - name: Run fetch-bsb.js (full)
        if: ${{ github.event.inputs.step == 'fetch-bsb-full' }}
        run: node fetch-bsb.js
        timeout-minutes: 120

      - name: Submit commentary batch (John only, for testing)
        if: ${{ github.event.inputs.step == 'generate-batch-submit-john' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node generate-commentary-batch.js --submit --book "John"

      - name: Submit commentary batch (Genesis only, for testing)
        if: ${{ github.event.inputs.step == 'generate-batch-submit-genesis' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node generate-commentary-batch.js --submit --book "Genesis"

      - name: Submit commentary batch (Revelation only, for testing)
        if: ${{ github.event.inputs.step == 'generate-batch-submit-revelation' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node generate-commentary-batch.js --submit --book "Revelation"

      - name: Submit commentary batch (all chapters)
        if: ${{ github.event.inputs.step == 'generate-batch-submit-all' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node generate-commentary-batch.js --submit

      - name: Check and save batch results
        if: ${{ github.event.inputs.step == 'generate-batch-check' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node generate-commentary-batch.js --check

      - name: Export offline bundle (BSB text + commentary combined)
        if: ${{ github.event.inputs.step == 'export-bundle' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node export-bundle.js

      - name: Upload bundle as downloadable artifact
        if: ${{ github.event.inputs.step == 'export-bundle' }}
        uses: actions/upload-artifact@v4
        with:
          name: bible-content-bundle
          path: data/bible-content-bundle.json
          retention-days: 14

      - name: Save Bible text for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: bsb-data-${{ github.run_id }}
